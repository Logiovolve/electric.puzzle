/* =====================================================================
   差し替え用パッチ
   元の <script> 内の以下を置き換えてください。
     1) function solveCircuit() { ... } 全体  → 下の「回路ソルバー」一式
     2) function exportUSDZ() { ... } 全体   → 下の「USDZ出力」
     3) touchend 内の1行修正 (ファイル末尾のコメント参照)
   crc32() / PARTS / 他の関数はそのままでOKです。
   ===================================================================== */


/* ================= 回路ソルバー (節点解析) =================
   - 各セルの「ポート」を節点にして、導線・部品を抵抗として扱い連立方程式を解く
   - 並列・直列・分岐・ショート・LEDの極性・開いたスイッチが物理的に正しく動く
   - 電流の向きは＋極から出る向き (乾電池の＋は左側ポート = ports[0])
   ======================================================================= */
const E_BATTERY = 1.5;     // 乾電池1個の電圧 [V]
const R_INTERNAL = 0.5;    // 乾電池の内部抵抗 [Ω]
const G_WIRE = 100;        // 導線のコンダクタンス (≒ほぼ0Ω)
const G_LEAK = 1e-7;       // 浮いた節点の安定化用
const I_ON = 1e-4;         // これ以上の電流で「通電」とみなす [A]
const I_SHORT = 1.0;       // 電池がこれ以上出したらショート扱い [A]
const R_ELEM = { bulb: 10, resistor: 20, ammeter: 0.01, voltmeter: 1e6, led: 5, switch: 0.001 };

function solveLinear(A, rhs) {
    const n = rhs.length;
    for (let i = 0; i < n; i++) {
        let p = i;
        for (let k = i + 1; k < n; k++) if (Math.abs(A[k][i]) > Math.abs(A[p][i])) p = k;
        [A[i], A[p]] = [A[p], A[i]];
        [rhs[i], rhs[p]] = [rhs[p], rhs[i]];
        const d = A[i][i];
        for (let k = i + 1; k < n; k++) {
            const f = A[k][i] / d;
            if (!f) continue;
            for (let j = i; j < n; j++) A[k][j] -= f * A[i][j];
            rhs[k] -= f * rhs[i];
        }
    }
    const x = new Array(n).fill(0);
    for (let i = n - 1; i >= 0; i--) {
        let s = rhs[i];
        for (let j = i + 1; j < n; j++) s -= A[i][j] * x[j];
        x[i] = s / A[i][i];
    }
    return x;
}

function solveCircuit() {
    let any = false, hasBattery = false;
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const cell = grid[r][c];
            if (!cell) continue;
            any = true;
            if (cell.type === 'battery') hasBattery = true;
            cell.powered = false;
            cell.flowDir = 'fwd';
        }
    }
    if (!any) { updateStatus(false, "盤面にパーツを配置してください"); return; }
    if (!hasBattery) { updateStatus(false, "開回路（電流なし）: 乾電池が配置されていません"); return; }

    const OFF = [[-1, 0], [0, 1], [1, 0], [0, -1]]; // 0:上 1:右 2:下 3:左
    const idMap = new Map();
    const nid = (r, c, d) => {               // d=0..3: ポート, d=4: セル中心
        const k = (r * COLS + c) * 5 + d;
        if (!idMap.has(k)) idMap.set(k, idMap.size);
        return idMap.get(k);
    };
    const portsOf = (cell) => {
        const s = (cell.rotation || 0) / 90;
        return PARTS[cell.type].ports.map(p => (p + s) % 4);
    };

    // ---- 辺（抵抗・導線・接続）を作る ----
    const edges = [];
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const cell = grid[r][c];
            if (!cell) continue;
            const t = cell.type;
            const ports = portsOf(cell);

            if (t.startsWith('wire_')) {
                const ctr = nid(r, c, 4);
                ports.forEach((p, i) => edges.push({
                    a: ctr, b: nid(r, c, p), g: G_WIRE, kind: 'wire', r, c, local: PARTS[t].ports[i]
                }));
            } else if (t === 'switch' && !cell.state.on) {
                // 開いたスイッチ: 内部で切れている
            } else if (t === 'battery') {
                edges.push({ a: nid(r, c, ports[0]), b: nid(r, c, ports[1]), g: 1 / R_INTERNAL, kind: 'battery', r, c });
            } else {
                edges.push({ a: nid(r, c, ports[0]), b: nid(r, c, ports[1]), g: 1 / R_ELEM[t], kind: t, r, c, on: true });
            }

            // 右・下の隣と、向かい合うポート同士をつなぐ（二重登録を避ける）
            [1, 2].forEach(d => {
                if (!ports.includes(d)) return;
                const nr = r + OFF[d][0], nc = c + OFF[d][1];
                if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) return;
                const nb = grid[nr][nc];
                if (!nb) return;
                const opp = (d + 2) % 4;
                if (!portsOf(nb).includes(opp)) return;
                edges.push({ a: nid(r, c, d), b: nid(nr, nc, opp), g: G_WIRE, kind: 'link' });
            });
        }
    }

    // ---- 連立方程式を解く（LEDは順方向のみ導通させるため反復） ----
    const n = idMap.size;
    const leds = edges.filter(e => e.kind === 'led');
    let v = new Array(n).fill(0);
    for (let it = 0; it < 8; it++) {
        const A = Array.from({ length: n }, () => new Array(n).fill(0));
        const rhs = new Array(n).fill(0);
        for (let i = 0; i < n; i++) A[i][i] += G_LEAK;
        edges.forEach(e => {
            if (e.kind === 'led' && !e.on) return;
            A[e.a][e.a] += e.g; A[e.b][e.b] += e.g;
            A[e.a][e.b] -= e.g; A[e.b][e.a] -= e.g;
            if (e.kind === 'battery') {           // ノートン等価: ＋極(a)へ電流を注入
                rhs[e.a] += E_BATTERY * e.g;
                rhs[e.b] -= E_BATTERY * e.g;
            }
        });
        v = solveLinear(A, rhs);
        let changed = false;
        leds.forEach(e => {
            const on = (v[e.a] - v[e.b]) > 1e-9;  // アノード(左)が高電位のときだけON
            if (on !== e.on) { e.on = on; changed = true; }
        });
        if (!changed) break;
    }

    // ---- 電流から通電状態・向きを決める ----
    let anyPowered = false, short = false;
    edges.forEach(e => {
        if (e.kind === 'link') return;
        const cell = grid[e.r][e.c];
        let I;
        if (e.kind === 'wire') {
            I = (v[e.a] - v[e.b]) * e.g;          // 中心 → ポート方向
            if (Math.abs(I) > I_ON) {
                cell.powered = true;
                if (e.local === 1) cell.flowDir = I >= 0 ? 'fwd' : 'rev'; // 描画の終点側
            }
            return;
        }
        if (e.kind === 'led' && !e.on) return;
        if (e.kind === 'battery') {
            const out = (E_BATTERY - (v[e.a] - v[e.b])) * e.g; // ＋極から外へ出る電流
            if (out > I_SHORT) short = true;
            I = -out;   // 電池内部は −極(右) → ＋極(左) = 逆向き
        } else {
            I = (v[e.a] - v[e.b]) * e.g;          // 左 → 右 が fwd
        }
        if (Math.abs(I) > I_ON) {
            cell.powered = true;
            cell.flowDir = I >= 0 ? 'fwd' : 'rev';
            if (e.kind === 'battery') anyPowered = true;
        }
    });

    if (short) {
        updateStatus(true, "⚠ ショート回路: 電池が導線だけでつながっています（電池が熱くなり危険）");
    } else if (anyPowered) {
        updateStatus(true, "閉回路完成（通電中）: ＋極から−極へ電流が流れています");
    } else {
        updateStatus(false, "開回路（電流なし）: 乾電池からループがつながっていません");
    }
}


/* ================= USDZ出力 =================
   - 1マス = 5cm (metersPerUnit=0.05) → ARで盤面が約50cm幅
   - 全部品に3Dモデルを用意、円柱は軸をY向きに修正
   - ZIPのパディングを正式なextra fieldとして書き込み（64byteアライメント）
   ============================================ */
function exportUSDZ() {
    const MATS = {
        BoardMat: [.05, .08, .14], TileMat: [.08, .12, .22], PoweredTileMat: [.12, .2, .35],
        WireMat: [.2, .8, 1], UnpoweredWireMat: [.6, .65, .7], GoldMat: [1, .75, .1],
        SilverMat: [.9, .9, .95], BulbMat: [1, .85, .1], LedMat: [.9, .1, .1],
        AmMat: [.2, .6, .95], VoMat: [.75, .5, .95]
    };
    const mat = (n) => `</CircuitBoard/Materials/${n}>`;
    const f = (x) => Number(x).toFixed(3);
    const prim = (type, name, t, s, m) =>
        `        def ${type} "${name}"\n        {\n` +
        (type === 'Cylinder' ? `            uniform token axis = "Y"\n` : '') +
        `            double3 xformOp:translate = (${t.map(f).join(', ')})\n` +
        `            double3 xformOp:scale = (${s.map(f).join(', ')})\n` +
        `            uniform token[] xformOpOrder = ["xformOp:translate", "xformOp:scale"]\n` +
        `            rel material:binding = ${mat(m)}\n        }\n`;

    let usda = `#usda 1.0\n(\n    defaultPrim = "CircuitBoard"\n    metersPerUnit = 0.05\n    upAxis = "Y"\n)\n\n`;
    usda += `def Xform "CircuitBoard"\n(\n    kind = "component"\n)\n{\n    def Scope "Materials"\n    {\n`;
    Object.keys(MATS).forEach(name => {
        usda += `        def Material "${name}"\n        {\n` +
            `            token outputs:surface.connect = </CircuitBoard/Materials/${name}/PBR.outputs:surface>\n` +
            `            def Shader "PBR"\n            {\n` +
            `                uniform token info:id = "UsdPreviewSurface"\n` +
            `                color3f inputs:diffuseColor = (${MATS[name].join(', ')})\n` +
            `                token outputs:surface\n            }\n        }\n`;
    });
    usda += `    }\n`;
    usda += `    def Cube "BaseBoard"\n    {\n` +
        `        double3 xformOp:translate = (0, -0.05, 0)\n` +
        `        double3 xformOp:scale = (${f(COLS / 2 * 1.0 + 0.2)}, 0.05, ${f(ROWS / 2 * 1.0 + 0.2)})\n` +
        `        uniform token[] xformOpOrder = ["xformOp:translate", "xformOp:scale"]\n` +
        `        rel material:binding = ${mat('BoardMat')}\n    }\n`;

    const DIR = [[0, -1], [1, 0], [0, 1], [-1, 0]]; // [x, z]
    let tileIdx = 0;
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const cell = grid[r][c];
            if (!cell) continue;
            const posX = (c - (COLS - 1) / 2), posZ = (r - (ROWS - 1) / 2);
            const wm = cell.powered ? 'WireMat' : 'UnpoweredWireMat';
            const tm = cell.powered ? 'PoweredTileMat' : 'TileMat';
            const t = cell.type;

            usda += `    def Xform "Tile_${tileIdx++}"\n    {\n` +
                `        double3 xformOp:translate = (${f(posX)}, 0.02, ${f(posZ)})\n` +
                `        float3 xformOp:rotateXYZ = (0, ${-(cell.rotation || 0)}, 0)\n` +
                `        uniform token[] xformOpOrder = ["xformOp:translate", "xformOp:rotateXYZ"]\n`;
            usda += prim('Cube', 'TileBase', [0, 0, 0], [0.46, 0.02, 0.46], tm);

            if (t.startsWith('wire_')) {
                // ローカルのポート方向へ中心から縁まで導線を伸ばす
                PARTS[t].ports.forEach((p, i) => {
                    const [dx, dz] = DIR[p];
                    const s = dx !== 0 ? [0.23, 0.015, 0.04] : [0.04, 0.015, 0.23];
                    usda += prim('Cube', `Wire${i}`, [dx * 0.23, 0.03, dz * 0.23], s, wm);
                });
            } else {
                // 2端子部品: 左右の足
                usda += prim('Cube', 'LegL', [-0.3, 0.03, 0], [0.16, 0.015, 0.04], wm);
                usda += prim('Cube', 'LegR', [0.3, 0.03, 0], [0.16, 0.015, 0.04], wm);
                if (t === 'battery') {
                    usda += prim('Cube', 'PosPlate', [-0.08, 0.06, 0], [0.02, 0.08, 0.24], 'GoldMat');
                    usda += prim('Cube', 'NegPlate', [0.08, 0.06, 0], [0.04, 0.05, 0.16], 'SilverMat');
                } else if (t === 'bulb') {
                    usda += prim('Cylinder', 'Bulb', [0, 0.04, 0], [0.22, 0.02, 0.22], 'BulbMat');
                } else if (t === 'ammeter') {
                    usda += prim('Cylinder', 'Ammeter', [0, 0.04, 0], [0.22, 0.02, 0.22], 'AmMat');
                } else if (t === 'voltmeter') {
                    usda += prim('Cylinder', 'Voltmeter', [0, 0.04, 0], [0.22, 0.02, 0.22], 'VoMat');
                } else if (t === 'resistor') {
                    usda += prim('Cube', 'Resistor', [0, 0.05, 0], [0.2, 0.04, 0.1], 'GoldMat');
                } else if (t === 'led') {
                    usda += prim('Cube', 'LedBody', [-0.03, 0.05, 0], [0.12, 0.05, 0.12], 'LedMat');
                    usda += prim('Cube', 'LedBar', [0.12, 0.06, 0], [0.02, 0.06, 0.15], 'SilverMat');
                } else if (t === 'switch') {
                    const ang = cell.state.on ? 0 : 25;   // 開いているときはレバーを持ち上げる
                    usda += `        def Cube "Lever"\n        {\n` +
                        `            double3 xformOp:translate = (0, ${f(cell.state.on ? 0.04 : 0.09)}, 0)\n` +
                        `            float3 xformOp:rotateXYZ = (0, 0, ${ang})\n` +
                        `            double3 xformOp:scale = (0.16, 0.012, 0.03)\n` +
                        `            uniform token[] xformOpOrder = ["xformOp:translate", "xformOp:rotateXYZ", "xformOp:scale"]\n` +
                        `            rel material:binding = ${mat('SilverMat')}\n        }\n`;
                    usda += prim('Cylinder', 'ContactL', [-0.14, 0.04, 0], [0.04, 0.03, 0.04], 'GoldMat');
                    usda += prim('Cylinder', 'ContactR', [0.14, 0.04, 0], [0.04, 0.03, 0.04], 'GoldMat');
                }
            }
            usda += `    }\n`;
        }
    }
    usda += `}\n`;

    try {
        const enc = new TextEncoder();
        const data = enc.encode(usda);
        const name = enc.encode("model.usda");

        // データ開始位置を64byte境界に揃える。extra fieldは「ID(2)+長さ(2)+本体」の形式で書く
        let pad = (64 - ((30 + name.length) % 64)) % 64;
        if (pad > 0 && pad < 4) pad += 64;
        const dataOffset = 30 + name.length + pad;
        const cdSize = 46 + name.length;
        const buf = new Uint8Array(dataOffset + data.length + cdSize + 22);
        const dv = new DataView(buf.buffer);
        const crc = crc32(data);

        // Local File Header
        dv.setUint32(0, 0x04034b50, true);
        dv.setUint16(4, 20, true);
        dv.setUint32(14, crc, true);
        dv.setUint32(18, data.length, true);
        dv.setUint32(22, data.length, true);
        dv.setUint16(26, name.length, true);
        dv.setUint16(28, pad, true);
        buf.set(name, 30);
        if (pad >= 4) {
            const e = 30 + name.length;
            dv.setUint16(e, 0x1986, true);       // USDZアライメント用のヘッダID
            dv.setUint16(e + 2, pad - 4, true);
        }
        buf.set(data, dataOffset);

        // Central Directory
        const cd = dataOffset + data.length;
        dv.setUint32(cd, 0x02014b50, true);
        dv.setUint16(cd + 4, 20, true);
        dv.setUint16(cd + 6, 20, true);
        dv.setUint32(cd + 16, crc, true);
        dv.setUint32(cd + 20, data.length, true);
        dv.setUint32(cd + 24, data.length, true);
        dv.setUint16(cd + 28, name.length, true);
        buf.set(name, cd + 46);

        // End of Central Directory
        const eo = cd + cdSize;
        dv.setUint32(eo, 0x06054b50, true);
        dv.setUint16(eo + 8, 1, true);
        dv.setUint16(eo + 10, 1, true);
        dv.setUint32(eo + 12, cdSize, true);
        dv.setUint32(eo + 16, cd, true);

        const url = URL.createObjectURL(new Blob([buf], { type: 'model/vnd.usdz+zip' }));
        const a = document.createElement('a');
        a.href = url;
        a.download = `教科書回路_3Dモデル_${Date.now()}.usdz`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    } catch (err) {
        console.error("USDZ Export Error:", err);
        alert("USDZファイルの生成に失敗しました。");
    }
}
